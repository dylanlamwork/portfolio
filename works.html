<meta charset="UTF-8">

<title>Works — Dylan Lam</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="[REDACTED_CONN_STRING]://300;400;500;600;700&amp;family=Sora:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{
    --bg:#f6f6f6;--surface:#eeeeee;--border:rgba(0,0,0,0.08);
    --text:#151515;--text-sub:#7a7a7a;--text-muted:rgba(0,0,0,0.35);
    --accent:#6644ff;--accent-glow:rgba(102,68,255,0.2);
    --amber:#fb923c;--indigo:#6644ff;--teal:#14b8a6;--purple:#a855f7;
    --font:'Inter',sans-serif;--display:'Sora','Inter',sans-serif;
    --fw-body:410;--fw-display:400;--radius:6px;--max-w:1199px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;letter-spacing:0.02em;font-weight:410;overflow-x:hidden}
.container{max-width:100%;margin:0 auto;padding:0 clamp(24px,5vw,64px)}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,0.06)}
.nav-inner{max-width:100%;padding:0 clamp(24px,5vw,64px);height:60px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.nav-brand{justify-self:start;font-family:var(--display);font-size:clamp(14px,1.2vw,16px);font-weight:500;color:var(--text);text-decoration:none;letter-spacing:-0.02em}
.nav-links{justify-self:center;display:flex;gap:clamp(16px,2.5vw,32px)}
.nav-links a{font-size:clamp(12px,1vw,14px);color:var(--text-sub);text-decoration:none;font-weight:410;transition:color 0.3s}
.nav-links a:hover{color:var(--text)}
.nav-cta{justify-self:end;font-size:clamp(12px,1vw,14px);padding:8px 16px;border-radius:var(--radius);background:var(--accent);color:#fff;text-decoration:none;font-weight:500;transition:opacity 0.3s}
.nav-cta:hover{opacity:0.85}
.menu-btn{display:none;background:none;border:none;cursor:pointer;width:28px;height:20px;position:relative}
.menu-btn span{display:block;width:100%;height:2px;background:var(--text);border-radius:2px;position:absolute;left:0;transition:0.3s}
.menu-btn span:nth-child(1){top:0}.menu-btn span:nth-child(2){top:9px}.menu-btn span:nth-child(3){top:18px}

/* HERO */
.page-hero{padding-top:clamp(120px,15vh,160px);padding-bottom:clamp(40px,6vh,60px)}
.page-hero h1{font-family:var(--display);font-size:clamp(36px,6vw,80px);font-weight:var(--fw-display);letter-spacing:-0.04em;line-height:1.05;margin-bottom:16px}
.page-hero .subtitle{font-size:clamp(14px,1.2vw,18px);color:var(--text-sub);max-width:500px}

/* FILTERS */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:clamp(32px,5vh,56px);padding-bottom:20px;border-bottom:none}
.filter-btn{padding:8px 16px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;font-family:var(--font);font-size:clamp(12px,1vw,14px);font-weight:410;color:var(--text-sub);cursor:pointer;transition:all 0.3s}
.filter-btn:hover{border-color:var(--text-sub)}
.filter-btn.active{background:var(--text);color:#fff;border-color:var(--text)}

/* PROJECT LIST */
.project-list{display:flex;flex-direction:column}
.project-row{position:relative;display:grid;grid-template-columns:minmax(180px,1.2fr) 1.5fr auto auto;align-items:center;gap:clamp(12px,2vw,24px);padding:clamp(16px,2.5vh,24px) 0;border-bottom:1px solid var(--border);cursor:pointer;overflow:hidden;transition:padding 0.3s,background 0.3s;text-align:left}
.project-row:first-child{border-top:1px solid var(--border)}
.project-row:hover{padding-left:16px;padding-right:16px;background:rgba(0,0,0,0.015);border-radius:var(--radius)}
.project-row .orb{position:absolute;border-radius:50%;opacity:0;transition:opacity 0.5s,transform 0.5s;transform:scale(0.5);pointer-events:none;filter:blur(35px)}
.project-row:hover .orb{opacity:1;transform:scale(1)}
.project-row .orb-1{width:100px;height:100px;top:-20px;left:-10px}
.project-row .orb-2{width:70px;height:70px;bottom:-15px;right:60px}
.proj-name{font-family:var(--display);font-size:clamp(14px,1.3vw,18px);font-weight:500;letter-spacing:-0.02em;position:relative;z-index:2}
.proj-scope{font-size:clamp(12px,1vw,14px);color:var(--text-sub);position:relative;z-index:2}
.proj-year{font-size:clamp(12px,1vw,14px);font-weight:410;color:var(--text-sub);position:relative;z-index:2}
.proj-link{width:24px;height:24px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-muted);position:relative;z-index:2;transition:color 0.3s;text-decoration:none}
.project-row:hover .proj-link{color:var(--text)}


/* Project hover description */
.proj-desc{position:absolute;left:0;right:0;bottom:0;padding:12px 16px;font-size:clamp(11px,0.9vw,13px);color:var(--text-sub);line-height:1.5;opacity:0;transform:translateY(4px);transition:opacity 0.3s,transform 0.3s;pointer-events:none;background:linear-gradient(to top,rgba(246,246,246,0.95),transparent);z-index:3}
.project-row:hover .proj-desc{opacity:1;transform:translateY(0)}
.project-row{padding-bottom:clamp(16px,2.5vh,24px)}
.project-row:hover{padding-bottom:clamp(36px,5vh,48px)}

/* TAG COLORS */

const list=document.getElementById('projectList');

function renderProjects(filter){
    list.innerHTML='';
    const filtered=filter==='all'?P:P.filter(p=>p.tags.includes(filter));
    filtered.forEach((p,i)=>{
        const mainTag=p.tags.find(t=>t!=='featured')||p.tags[0];
        const tagClass=TAG_CLASSES[mainTag]||'tag-data';
        const scope=p.tags.filter(t=>t!=='featured').map(t=>TAG_LABELS[t]).join(' · ');
        const row=document.createElement('div');
        row.className='project-row '+tagClass+' reveal';
        row.style.transitionDelay=(i*0.03)+'s';
        row.innerHTML=`
            <div class="orb orb-1"></div><div class="orb orb-2"></div>
            <div class="proj-name">${p.t}</div>
            <div class="proj-scope">${scope}</div>
            <div class="proj-year">${p.y}</div>
            ${p.l?`<a href="${p.l}" target="_blank" class="proj-link">↗</a>`:`<div class="proj-link"></div>`}
            <div class="proj-desc">${p.d}</div>
        `;
        if(p.l){row.addEventListener('click',()=>window.open(p.l,'_blank'))}
        list.appendChild(row);
        requestAnimationFrame(()=>setTimeout(()=>row.classList.add('visible'),50+i*30));
    });
}

// Filter buttons
