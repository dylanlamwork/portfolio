<style>
:root{
  /* neutral ramp */
  --ink:#0c0c0c; --ink-2:#2b2b2b; --grey-1:#585858; --grey-2:#8f9091;
  --line:#dcdcdc; --line-2:#e6e6e8; --surface:#f3f3f3; --bg:#fafafa;
  /* category accents */
  --data:#6644ff; --pm:#14b8a6; --sales:#fb923c; --system:#a855f7;
      /* banner variants — vivid palette fails WCAG with white type, these pass:
         data 5.5:1 · pm 5.2:1 · sales 5.3:1 · system 7.0:1 */
      --bn-data:#4B2ED6; --bn-pm:#0E7A6E; --bn-sales:#B0500C; --bn-system:#7A2FBF;
  --sans:'Inter',-apple-system,sans-serif;
  /* display type: Basel Grotesk Medium equivalent = Inter 600 + opsz 32 */
      --w-display:600; --ls-display:-0.04em; --lh-display:0.86;
      --opsz-d:'opsz' 32; --opsz-t:'opsz' 16;
  --mono:'Fragment Mono',ui-monospace,monospace;
  --maxw:none;              /* full-bleed, like Lab (no centred cap) */
  --gut:clamp(20px,2.6vw,56px);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;font-weight:400;font-variation-settings:var(--opsz-t);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{max-width:var(--maxw);width:100%;margin:0 auto;padding:0 var(--gut)}

/* ── mono label primitive ── */
.mono{font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--grey-2)}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(250,250,250,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line-2)}
.nav-in{max-width:var(--maxw);margin:0 auto;padding:0 var(--gut);height:64px;display:flex;align-items:center}
.brand{font-size:15px;font-weight:600;letter-spacing:-0.02em;color:var(--ink);text-decoration:none;font-variation-settings:var(--opsz-d)}
.menu-toggle{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:0.1em;
  text-transform:uppercase;color:var(--ink);background:none;border:none;cursor:pointer;padding:8px 0;
  transition:opacity .25s}
.menu-toggle:hover{opacity:.5}
.underlay{position:fixed;inset:0;background:rgba(12,12,12,.45);opacity:0;visibility:hidden;
  transition:opacity .5s ease,visibility .5s;z-index:400;cursor:pointer}
.underlay.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,86vw);background:#0c0c0c;z-index:500;
  padding:clamp(22px,3vw,34px);display:flex;flex-direction:column;justify-content:space-between;
  transform:translateX(100%);transition:transform .62s cubic-bezier(.16,1,.3,1)}
.drawer.on{transform:none}
.drawer-top{display:flex;align-items:center;justify-content:flex-end;height:26px;margin-bottom:auto}
.drawer-close{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;text-transform:uppercase;
  color:rgba(255,255,255,.55);background:none;border:none;cursor:pointer;transition:color .25s}
.drawer-close:hover{color:#fff}
.drawer-links{display:flex;flex-direction:column;gap:clamp(2px,0.5vh,6px);margin:auto 0}
.drawer-links a{font-size:clamp(34px,4.6vw,60px);font-weight:600;letter-spacing:-0.045em;line-height:1.06;
  font-variation-settings:var(--opsz-d);color:#fff;text-decoration:none;transition:opacity .3s}
.drawer-links a:hover{opacity:.35}
.drawer-links a.on{color:var(--grey-2)}
.drawer-info{display:grid;gap:16px}
.drawer-info .di-k{font-family:var(--mono);font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;
  color:rgba(255,255,255,.35);margin-bottom:5px}
.drawer-info .di-v,.drawer-info .di-v a{font-size:14px;color:rgba(255,255,255,.85);text-decoration:none;
  letter-spacing:-0.01em;transition:opacity .25s}
.drawer-info .di-v a:hover{opacity:.5}
.drawer-social{display:flex;gap:18px}
body.lock{overflow:hidden}
@media(max-width:768px){.drawer{width:100%;padding:20px}}


/* ── HERO ── */
/* ── HERO: single giant word, edge to edge (Rice pattern) ──
   Fit-to-width is CORRECT here: one word, one line, so there is no
   per-line size inconsistency — the problem that killed it on the
   old 3-line sentence simply cannot occur. */
.hero{padding-top:clamp(84px,11vh,120px);padding-bottom:clamp(6px,1.2vh,14px)}
.bigword{display:block;width:max-content;white-space:nowrap;font-weight:700;
  letter-spacing:-0.055em;line-height:0.78;font-variation-settings:'opsz' 32;
  color:var(--ink);margin-left:-0.04em}   /* negative bearing = optical flush left */

/* ── FILTERS: inline comma-separated list (Rice pattern) ── */
.filters{display:block;padding:0 0 clamp(26px,4vh,44px);border:none;margin:0}
.fbtn{font-family:var(--sans);font-size:clamp(17px,2.05vw,34px);font-weight:600;
  font-variation-settings:'opsz' 32;letter-spacing:-0.03em;line-height:1.16;
  padding:0;border:none;border-radius:0;background:none;text-transform:none;
  color:#c2c2c6;cursor:pointer;transition:color .2s}
.fbtn:hover{color:var(--grey-1)}
.fbtn.on{color:var(--ink)}
.fsep{font-family:var(--sans);font-size:clamp(17px,2.05vw,34px);font-weight:600;
  font-variation-settings:'opsz' 32;letter-spacing:-0.03em;color:#c2c2c6;margin-right:.28em}
.fcount{display:block;font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--grey-2);margin-top:clamp(14px,2vh,22px)}

/* ── TILE GRID ── */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(28px,3vw,44px) clamp(14px,1.5vw,22px)}
.tile{container-type:inline-size;display:block;text-decoration:none;color:inherit;opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
.tile.in{opacity:1;transform:none}

/* ── BANNER (Direction C): project name at scale on flat discipline colour ──
   No imagery, no encoding, no generated marks. Identical rule on all 23 cards.
   Colour is the only variable, and it maps to one thing: discipline. */
.canvas{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;
  display:flex;align-items:flex-end;padding:clamp(14px,4cqi,22px);
  background:var(--bn);transition:transform .5s cubic-bezier(.16,1,.3,1)}
.tile:hover .canvas{transform:translateY(-4px)}

/* the name — fills the banner, wraps naturally, never overflows */
.pname{font-size:clamp(19px,9.4cqi,40px);font-weight:700;
  font-variation-settings:var(--opsz-d);letter-spacing:-0.042em;line-height:0.94;
  color:#fff;text-wrap:balance;position:relative;z-index:2}

/* index + discipline, top row of banner */
.canvas-top{position:absolute;top:clamp(12px,3.4cqi,20px);left:clamp(14px,4cqi,22px);right:clamp(14px,4cqi,22px);
  display:flex;justify-content:space-between;z-index:2;font-family:var(--mono);font-size:10px;
  letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,.62)}

/* caption below canvas */
.cap-row{display:flex;align-items:baseline;gap:14px;margin-top:14px}
.t-right{font-family:var(--mono);font-size:11px;color:var(--grey-2);margin-left:auto;flex-shrink:0;display:flex;align-items:center;gap:2px}
.t-meta{font-family:var(--mono);font-size:11px;letter-spacing:0.04em;color:var(--grey-2)}
.t-desc{font-size:14px;color:var(--grey-1);line-height:1.55;margin-top:8px;max-width:58ch}
.ext{display:inline-block;margin-left:5px;opacity:.55;color:var(--grey-2);transition:opacity .25s,transform .25s,color .25s}
.tile:hover .ext{opacity:1;color:var(--ink);transform:translate(2px,-2px)}

/* ── FOOTER (Rice pattern): live clocks · links · copyright, one tight row ── */
footer.wrap{padding-top:clamp(120px,22vh,260px);padding-bottom:clamp(30px,4.5vh,48px)}
    /* keep the footer at the bottom even when a filter leaves only 1-2 cards */
    html,body{min-height:100%}
    body{display:flex;flex-direction:column;min-height:100vh}
    main{flex:1 0 auto}
    footer.wrap{flex-shrink:0}
.f-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:24px 32px;align-items:start}
.f-cell{font-size:clamp(13px,1.05vw,15px);font-weight:500;letter-spacing:-0.015em;
  line-height:1.45;color:var(--ink)}
.f-cell.end{text-align:right}
.f-cell a{display:block;color:var(--ink);text-decoration:none;transition:opacity .25s}
.f-cell a:hover{opacity:.5}
.f-cell .t{font-variant-numeric:tabular-nums}

@media(max-width:1400px){ .grid{grid-template-columns:repeat(3,1fr)} }
    @media(max-width:1000px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media(max-width:768px){
  .grid{grid-template-columns:1fr}
  .fcount{display:none}
  .f-row{grid-template-columns:1fr 1fr}
  .f-cell.end{text-align:left}
}

/* ═══════════ NAV — RICE SPEC ═══════════
   Verified against thisisrice.com/wp-content/themes/thisisrice/public/css/app.7c6feb.css
   .t-title ladder:  >=1920 40/48   <=1919 34/40   <=1679 30/36
                     <=1403 24/28   <=1152 16/20   <=1023 20/24   (weight 400, no tracking)
   Header: 8-col grid, items-baseline, opaque, no border, no blur.
   py 30/21/18/15/12/15 (Rice). Horizontal padding uses var(--gut) instead of
   their px 40/20/10 so the mark and Menu land on the SAME gutter as page
   content — Rice can use 40 because their content grid uses 40 too.
   Brand col 1. Menu pinned to the last column, justify-end, so it lands on
   the page right gutter (deviation from Rice, who place it on the 50% line).
   text-grey #BEBEBE. Page links live in the drawer — same as Rice.

   BRAND: Dylan's own mark (logo.svg) replaces the wordmark. Because .nav-in is
   align-items:baseline and the logo image is a block, the badge's bottom edge lands
   on Menu's text baseline. Rice fade their brand to grey on hover; a fixed-
   colour badge can't, so opacity is the equivalent.
   Alternates, one-line src swap: logo-ink.svg (site tokens), logo-mono.svg. */
:root{--rice-grey:#BEBEBE;--nav-h:108px;--logo-h:32px}

nav{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:none}
.nav-in{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));align-items:baseline;
  height:auto;gap:40px;padding:30px var(--gut)}
.nav-in>*{min-width:0}

.brand{grid-column:1;display:inline-block;font-size:0;line-height:0;text-decoration:none;
  transition:opacity .3s}
.brand:hover{opacity:.55}
.brand img{height:var(--logo-h);width:auto;display:block}

.menu-toggle{grid-column:8;justify-self:end;margin-left:0;padding:0;
  font-family:var(--sans);font-size:40px;line-height:48px;font-weight:500;letter-spacing:0;
  text-transform:none;color:var(--ink);background:none;border:none;cursor:pointer;
  font-variation-settings:var(--opsz-d);transition:color .3s}
.menu-toggle:hover{color:var(--rice-grey);opacity:1}

/* fixed nav is padding-driven (44-108px), so clearance tracks --nav-h */
.hero{padding-top:calc(var(--nav-h) + clamp(24px,4vh,56px));padding-bottom:clamp(6px,1.2vh,14px)}

@media(max-width:1919px){   /* gig */
  :root{--nav-h:82px;--logo-h:28px}
  .nav-in{gap:20px;padding:21px var(--gut)}
  .menu-toggle{font-size:34px;line-height:40px}
}
@media(max-width:1679px){   /* mas */
  :root{--nav-h:72px;--logo-h:25px}
  .nav-in{padding:18px var(--gut)}
  .menu-toggle{font-size:30px;line-height:36px}
}
@media(max-width:1403px){   /* lar */
  :root{--nav-h:58px;--logo-h:21px}
  .nav-in{padding:15px var(--gut)}
  .menu-toggle{font-size:24px;line-height:28px}
}
@media(max-width:1152px){   /* med */
  :root{--nav-h:44px;--logo-h:15px}
  .nav-in{gap:10px;padding:12px var(--gut)}
  .menu-toggle{font-size:16px;line-height:20px}
}
@media(max-width:1023px){   /* tab — Rice drop to 4 cols, Menu hard right */
  :root{--nav-h:54px;--logo-h:18px}
  .nav-in{grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding:15px var(--gut)}
  .menu-toggle{grid-column:4;justify-self:end}
  .menu-toggle{font-size:20px;line-height:24px}
}
</style>

/* Banner map: discipline -> banner colour. The only visual variable. */
const BANNER={data:'var(--bn-data)',pm:'var(--bn-pm)',sales:'var(--bn-sales)',notion:'var(--bn-system)'};

/* ─────────── RENDER ─────────── */
const grid=document.getElementById('grid'),fc=document.getElementById('fcount');
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});

function render(f){
  grid.innerHTML='';
  const rows=f==='all'?P:P.filter(p=>p.tags.includes(f));
  fc.textContent=String(rows.length).padStart(2,'0')+' Projects';
  rows.forEach((p,i)=>{
    const main=p.tags.find(t=>t!=='featured')||p.tags[0];
    const scope=p.tags.filter(t=>t!=='featured').map(t=>TAGS[t]).join('  ·  ');
    const el=document.createElement(p.l?'a':'div');
    el.className='tile';
    if(p.l){el.href=p.l;el.target='_blank';el.rel='noopener'}
    el.style.transitionDelay=(Math.min(i,8)*45)+'ms';
    const arrow=p.l?'<svg class="ext" width="13" height="13" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 9L9 3M9 3H4M9 3v5"/></svg>':'';
    el.innerHTML=`
      <div class="canvas" style="--bn:${BANNER[main]||BANNER.data}">
        <div class="canvas-top">
          <span>${String(P.indexOf(p)+1).padStart(2,'0')}</span>
          <span>${main==='notion'?'system':main}</span>
        </div>
        <div class="pname">${p.t}</div>
      </div>
      <div class="cap-row">
        <div class="t-meta">${p.c} &mdash; ${scope}</div>
        <div class="t-right">${p.y}${arrow}</div>
      </div>
      <div class="t-desc">${p.d}</div>`;
    grid.appendChild(el);io.observe(el);
  });
}

document.querySelectorAll('.fbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');render(b.dataset.f);

/* ── NAV DRAWER (Rice pattern) ── */
var drawer=document.getElementById('drawer'),under=document.getElementById('underlay');
function openMenu(){drawer.classList.add('on');under.classList.add('on');document.body.classList.add('lock')}
function shutMenu(){drawer.classList.remove('on');under.classList.remove('on');document.body.classList.remove('lock')}
document.getElementById('menuBtn').addEventListener('click',openMenu);
document.getElementById('closeBtn').addEventListener('click',shutMenu);

addEventListener('keydown',function(e){if(e.key==='Escape')shutMenu()});

/* ── FIT THE GIANT WORD ──────────────────────────────────────────────
   Safe to measure-and-scale because it is ONE word on ONE line: there
   are no sibling lines to disagree with, so the per-line inconsistency
   that killed the old 3-span headline cannot occur here.
   CSS vw units can only approximate flush edges; this is exact. */
function fitWord(){
  const el=document.querySelector('.bigword'); if(!el) return;
  const cw=el.parentElement.clientWidth; if(!cw) return;
  const PROBE=400;
  el.style.fontSize=PROBE+'px';
  const w=el.getBoundingClientRect().width; if(!w) return;
  const size=PROBE*cw/w;
  el.style.fontSize=size+'px';
  /* Descender-aware spacing. A line-height below 1.0 makes the box SHORTER
     than the glyphs, so descenders (y, g, p, j, q) hang outside it and collide
     with whatever follows. Inter's content area is ~1.21em, so the overflow is
     (1.21 - lineHeight) / 2 on each side. Reserve the lower half as padding.
     Self-correcting: works for any word, descender or not, at any viewport. */
  const lh=parseFloat(getComputedStyle(el).lineHeight)/size;
  el.style.paddingBottom=Math.max(0,(1.21-lh)/2*size)+'px';
}
/* ── FOOTER CLOCKS ───────────────────────────────────────────────────
   Real per-timezone time via Intl, so DST and offsets are always right
   (no hardcoded +07/+09 that silently rots). Ticks every second. */
function clocks(){
  document.querySelectorAll('.f-cell[data-tz]').forEach(cell=>{
    const tz=cell.dataset.tz, now=new Date();
    cell.querySelector('.t').textContent=now.toLocaleTimeString('en-US',
      {timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
    const date=now.toLocaleDateString('en-US',
      {timeZone:tz,weekday:'long',month:'short',day:'2-digit',year:'numeric'});
    const off=new Intl.DateTimeFormat('en-US',{timeZone:tz,timeZoneName:'longOffset'})
      .formatToParts(now).find(p=>p.type==='timeZoneName').value.replace('GMT','GMT');
    cell.querySelector('.l2').textContent=`${date} (${off})`;
  });
}
clocks();setInterval(clocks,1000);

addEventListener('resize',fitWord);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitWord);
fitWord();
    render('all');
</script>
