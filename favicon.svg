<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Outer glow -->
    <radialGradient id="glow-outer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6644ff" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#6644ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060612" stop-opacity="0"/>
    </radialGradient>
    <!-- Inner glow -->
    <radialGradient id="glow-inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#6644ff"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#060612"/>
  <!-- Subtle ray hints -->
  <ellipse cx="16" cy="16" rx="14" ry="3" fill="#2563eb" opacity="0.08" transform="rotate(-10 16 16)"/>
  <ellipse cx="16" cy="16" rx="12" ry="2.5" fill="#06b6d4" opacity="0.06" transform="rotate(15 16 16)"/>
  <!-- Outer glow halo -->
  <circle cx="16" cy="16" r="10" fill="url(#glow-outer)"/>
  <!-- Main circle -->
  <circle cx="16" cy="16" r="5" fill="url(#glow-inner)"/>
  <!-- Bright center point -->
  <circle cx="16" cy="16" r="2" fill="#c4b5fd" opacity="0.8"/>
</svg>
